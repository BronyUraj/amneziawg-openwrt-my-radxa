name: New - Build AmneziaWG from SDK

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version"
        type: string
        required: true
        default: "24.10.6"
      amneziawg_version:
        description: "AmneziaWG version"
        type: string
        required: true
        default: "v3.1.2"
      openwrt_arch:
        description: "OpenWrt arch"
        type: string
        required: true
        default: "aarch64_generic"
      openwrt_target:
        description: "OpenWrt target"
        type: string
        required: true
        default: "rockchip"
      openwrt_subtarget:
        description: "OpenWrt subtarget"
        type: string
        required: true
        default: "armv8"
      compile_kmod:
        description: "Compile kernel module implementation"
        type: boolean
        required: true
        default: false
      compile_go:
        description: "Compile Go implementation"
        type: boolean
        required: true
        default: true

jobs:
  build-amneziawg:
    name: "Build AmneziaWG for OpenWrt: ${{ inputs.openwrt_version }} - ${{ inputs.openwrt_arch }} - ${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}"
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout YAAWG repository
      uses: actions/checkout@v5
      with:
        path: amneziawg
        ref: ${{ inputs.amneziawg_version }}
        fetch-depth: 0

    - name: Checkout OpenWRT Packages repository
      uses: actions/checkout@v5
      if: ${{ inputs.compile_go }}
      with:
        path: packages
        repository: openwrt/packages
        fetch-depth: 0

    - name: Install additional packages
      run: |
        set -e -x
        sudo apt-get update
        sudo apt-get install -y python3-pyelftools python3-dev python3-setuptools swig

    - name: Download and prepare SDK
      env:
        compile_go: ${{ inputs.compile_go }}
      run: |
        set -e -x
        if [ "${{ inputs.openwrt_version }}" = "SNAPSHOT" ]; then
          base_url="https://downloads.openwrt.org/snapshots/targets/${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}/"
        else
          base_url="https://downloads.openwrt.org/releases/${{ inputs.openwrt_version }}/targets/${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}/"
        fi
        file_name="openwrt-sdk-24.10.6-rockchip-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
        
        curl -fL \
          --retry 5 \
          --retry-delay 3 \
          --connect-timeout 20 \
          --max-time 900 \
          -o "$file_name" \
          "${base_url}${file_name}"
        
        printf '%s  %s\n' \
          '5777901cd7fb62609285845752a5ebd9aa7fcda20778c8dd6000a710f57356fd' \
          "$file_name" | sha256sum -c -
        
        mkdir -p openwrt
        tar -xf "$file_name" -C openwrt --strip-components=1
        rm -- "$file_name"

        echo "src-cpy awgopenwrt ../amneziawg" >> openwrt/feeds.conf.default
        ./openwrt/scripts/feeds update -a
        curl -fsL "$base_url/config.buildinfo" > openwrt/.config
        echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20=y" >> openwrt/.config
        echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=y" >> openwrt/.config
        echo "CONFIG_PACKAGE_kmod-crypto-chacha20poly1305=y" >> openwrt/.config
        echo "CONFIG_PACKAGE_kmod-amneziawg=y" >> openwrt/.config
        echo "CONFIG_PACKAGE_amneziawg-go=y" >> openwrt/.config
        echo "CONFIG_PACKAGE_amneziawg-tools=y" >> openwrt/.config
        echo "CONFIG_PACKAGE_luci-proto-amneziawg=y" >> openwrt/.config
        # amneziawg-go requires Go >= 1.25. Only override the SDK's Go feed when
        # it is actually too old.
        if [ "${{ env.compile_go }}" = "true" ]; then
          sdk_go=$(sed -n 's/^GO_DEFAULT_VERSION:=//p' openwrt/feeds/packages/lang/golang/golang-values.mk)
          if [ -z "$sdk_go" ]; then
            sdk_go=$(sed -n 's/^GO_VERSION_MAJOR_MINOR:=//p' openwrt/feeds/packages/lang/golang/golang/Makefile)
          fi
          need_go=1.25
          if [ -z "$sdk_go" ] || \
             [ "$(printf '%s\n%s\n' "$need_go" "$sdk_go" | sort -V | head -n1)" != "$need_go" ]; then
            echo "SDK ships Go $sdk_go (< $need_go); overriding golang feed from openwrt/packages."
            rm -r openwrt/feeds/packages/lang/golang
            cp -r packages/lang/golang openwrt/feeds/packages/lang
            # The new Go feed contains versioned compiler and bootstrap packages.
            # Refresh its index without reverting the copied files from Git.
            ./openwrt/scripts/feeds update -i packages
          else
            echo "SDK ships Go ${sdk_go:-unknown} (>= $need_go); keeping the SDK golang feed."
          fi
        fi
        ./openwrt/scripts/feeds install -a
        make -C openwrt defconfig
  
    - name: Compile AmneziaWG packages
      env:
        compile_kmod: ${{ inputs.compile_kmod }}
        compile_go: ${{ inputs.compile_go }}
      run: |
        set -e -x
        cd openwrt
        if [ "${{ env.compile_kmod }}" = "true" ]; then
          make package/kmod-amneziawg/{clean,download,prepare,compile} -j "$(nproc)" V=s
        fi
        if [ "${{ env.compile_go }}" = "true" ]; then
          make package/amneziawg-go/{clean,download,prepare,compile} -j "$(nproc)" V=s
        fi
        make package/luci-proto-amneziawg/{clean,download,prepare,compile} -j "$(nproc)" V=s
        make package/amneziawg-tools/{clean,download,prepare,compile} -j "$(nproc)" V=s

    - name: Prepare artifacts
      run: |
        set -e -x
        mkdir awgrelease
        if [ "${{ inputs.compile_kmod }}" = "true" ]; then
          find "openwrt/bin/targets/${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}/packages" -maxdepth 1 -type f -name 'kmod-amneziawg*' -exec cp {} awgrelease \;
        fi
        find "openwrt/bin/packages/${{ inputs.openwrt_arch }}/awgopenwrt" -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} awgrelease \;

        # The kernel module can only be installed on a firmware whose kernel
        # reports the very same vermagic. Let's calculate it
        vermagic=""
        vermagic_file="$(find openwrt/build_dir -maxdepth 5 -type f -name '.vermagic' -print -quit)"
        if [ -n "$vermagic_file" ]; then
          vermagic="$(cat "$vermagic_file")"
        fi
        if [ -z "$vermagic" ]; then
          vermagic="$(sed -n 's/.*LINUX_VERMAGIC),\([^,)]*\))[[:space:]]*$/\1/p' openwrt/include/kernel.mk | head -n1)"
        fi
        [ -n "$vermagic" ] || vermagic="unknown"

        {
          echo "YAAWG version: ${{ inputs.amneziawg_version }}"
          echo "OpenWrt version: ${{ inputs.openwrt_version }}"
          echo "Target: ${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}"
          echo "Architecture: ${{ inputs.openwrt_arch }}"
          echo "Built at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Vermagic: $vermagic"
        } > awgrelease/build-info.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: amneziawg-${{ inputs.openwrt_version }}_${{ inputs.openwrt_arch }}_${{ inputs.openwrt_target }}_${{ inputs.openwrt_subtarget }}
        path: awgrelease/*
        if-no-files-found: error
